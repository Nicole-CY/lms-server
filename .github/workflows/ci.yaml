name: CI/CD for dev branch

on:
    push:
        branches:
            - dev
    pull_request:
        branches:
            - dev

jobs:
    unit-tests:
        name: Run Unit Tests
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout repo
              uses: actions/checkout@v3

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'

            - name: Install dependencies
              run: npm install

            - name: Run Unit Tests
              run: npm run test:unit

    integration-tests:
        name: Integration Tests in Docker
        runs-on: ubuntu-latest
        needs: unit-tests
        timeout-minutes: 15

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: 12345678
                    MYSQL_DATABASE: moocdb
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
            redis:
                image: redis:latest
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd="redis-cli ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            - uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'

            - name: Install dependencies
              run: npm install

            - name: Wait for MySQL to be ready
              run: sleep 10 # optional, depends on health check
              timeout-minutes: 5

            - name: Wait for Redis to be ready
              run: sleep 10 # optional, depends on health check
              timeout-minutes: 5

            - name: Run Integration Tests
              env:
                  NODE_ENV: test
              run: npm run test:integration
