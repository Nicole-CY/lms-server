name: Deploy to EC2

on:
    push:
        branches:
            - dev

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Setup SSH key
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa

            - name: Add EC2 to known hosts
              run: |
                  ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

            - name: Deploy to EC2
              run: |
                  ssh ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
                    cd /home/ec2-user/my-express-app
                    git pull origin dev
                    npm install
                    pm2 restart all || pm2 start index.js --name your-app-name
                  EOF
